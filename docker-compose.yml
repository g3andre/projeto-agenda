services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3030:3000"
    environment:
      CONNECTIONSTRING: mongodb://mongo:27017/agenda
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
